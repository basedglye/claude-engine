name: CI

on:
  push:
    branches: [main, phase-1, phase-2, phase-3]
  pull_request:
    branches: [main, phase-1, phase-2, phase-3]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check purity
        run: npm run check:purity

      - name: Check plugin (manifest, marketplace, SKILL.md, templates)
        run: npm run check:plugin

      - name: Test (smoke)
        run: npm test

      - name: Assets determinism tests
        run: npm run test --workspace @claude-engine/assets

      - name: Core unit tests (Rng state, forkRng, Sim.restore)
        run: npm run test --workspace @claude-engine/core

      - name: Net unit tests (protocol, client prediction/reconciliation)
        run: npm run test --workspace @claude-engine/net

      - name: Bots unit tests
        run: npm run test --workspace @claude-engine/bots

      - name: Server unit tests (auth, validation, rate limiting)
        run: npm run test --workspace @claude-engine/server

      - name: Harness smoke scenario
        run: npm run harness --silent -- smoke

      - name: Harness checkpoint + replay-from-verdict (+ --from-checkpoint)
        run: |
          npm run harness --silent -- smoke --out /tmp/smoke-verdict.json
          npm run harness --silent -- --replay /tmp/smoke-verdict.json
          npm run harness --silent -- --replay /tmp/smoke-verdict.json --from-checkpoint 50

      - name: Harness bots-headless scenario (--verify-replay)
        run: npm run harness --silent -- bots-headless --verify-replay

      - name: Harness soak scenarios (net-walk, net-interest, net-abuse, soak-ci)
        run: |
          npm run harness --silent -- net-walk --soak
          npm run harness --silent -- net-interest --soak
          npm run harness --silent -- net-abuse --soak
          npm run harness --silent -- soak-ci --soak

      - name: Asset import pipeline fixtures
        run: |
          npm run assets:import --silent -- packages/asset-pipeline/fixtures/good-texture.png --type texture --into /tmp/ci-import --validate-only
          npm run assets:import --silent -- packages/asset-pipeline/fixtures/good-mesh.glb --type mesh --into /tmp/ci-import
          if npm run assets:import --silent -- packages/asset-pipeline/fixtures/bad-texture-oversized.png --type texture --into /tmp/ci-import --validate-only; then
            echo "bad-texture-oversized.png should have failed validation" >&2
            exit 1
          fi
          if npm run assets:import --silent -- packages/asset-pipeline/fixtures/bad-mesh-overtris.glb --type mesh --into /tmp/ci-import --validate-only; then
            echo "bad-mesh-overtris.glb should have failed validation" >&2
            exit 1
          fi

      - name: Scaffold smoke (both templates, unedited)
        run: |
          set -e
          for template in 3d-world topdown-2d; do
            app="ci-scaffold-$template"
            npm run scaffold --silent -- "$app" --template "$template"
            npm install
            npm run build --workspace "@claude-engine/$app"
            npm run harness --silent -- "apps/$app/scenarios/first-run.scenario.mjs"
            rm -rf "apps/$app"
            npm install
          done

  persistence:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claude_engine
          POSTGRES_PASSWORD: claude_engine
          POSTGRES_DB: claude_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claude_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Persistence tests (SQLite + Postgres conformance/crash-recovery)
        env:
          DATABASE_URL: postgres://claude_engine:claude_engine@localhost:5432/claude_engine_test
        run: npm run test --workspace @claude-engine/persistence

  browser:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npm run build

      - name: Harness demo-visual scenario (--browser)
        run: npm run harness --silent -- demo-visual --browser

      - name: Upload browser-mode screenshots
        uses: actions/upload-artifact@v4
        with:
          name: harness-browser-screenshots
          path: artifacts/harness/
          if-no-files-found: error
